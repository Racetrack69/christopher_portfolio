# ------------------------------------------------------------
# Grundeinstellungen der Seite
# ------------------------------------------------------------
title: Christopher Schmidtke
description: >-
  Schwarzweißfotografie auf Film von Christopher Schmidtke, im Mittelformat und auf Kleinbild.
  Serien aus Japan, Skandinavien, den USA, Madeira, Island und in Infrarot.

# Kleine Zeile unter dem Namen im Kopf (auf allen Seiten). Leer lassen = keine Zeile.
unterzeile: Analoge Fotografie · Schwarzweiß

# Text oben auf der Startseite
einleitung: >-
  Ich fotografiere auf Film, fast immer in Schwarzweiß und am liebsten im Quadrat.
  Unterwegs zähle ich die Bilder und lasse lieber einen Moment aus. Was auf der Rolle ist,
  sehe ich oft erst Wochen später. Bis dahin passiert vieles im Kopf. Wenn die Negative
  aus dem Labor kommen, schaue ich mit Abstand hin. Hier hängen die, die geblieben sind.
lang: de
locale: de_DE

# Die Adresse der Seite (url, baseurl) setzt GitHub Pages automatisch,
# passend zum Repository-Namen und später zur eigenen Domain. Nicht eintragen.

author:
  name: Christopher Schmidtke
  email: ""          # erst eintragen, wenn das Postfach funktioniert, z. B. kontakt@christopherschmidtke.de
                     # erscheint dann automatisch in Impressum und Datenschutzerklärung
  instagram: ""      # nur der Name, ohne @

# Anschrift für Impressum und Datenschutzerklärung
anschrift:
  strasse: Elsavastraße 36
  ort: 63863 Eschau

# Suchmaschinen: true = Seiten dürfen in Google, Bing usw. erscheinen.
# false = alle Seiten tragen "noindex". Impressum, Datenschutz und 404 bleiben immer noindex.
indexierung: true

# Impressum und Datenschutz im Footer verlinken
rechtliches: true

# Desktop-Hängung der Serien: reihen | raster | einzeln
# Auf dem Handy gibt es immer eine Spalte.
haengung: reihen

# Lange Kante der Bilder in Pixel. tools/bilder.py liest diesen Wert.
# Nach einer Änderung die Bilder mit tools/bilder.py neu erzeugen.
bildgroesse: 1600

# Vorschaubild für Link-Vorschauen auf Seiten ohne eigenes Bild (Startseite, Journal, ...)
# Ideal 1200 × 630 px. Serienseiten nutzen ihr Titelbild, Beiträge ihr "bild".
og_bild: /assets/images/vorschau/start-mamiya-stativ.jpg

# ------------------------------------------------------------
# Inhalte
# ------------------------------------------------------------
collections:
  serien:
    output: true
    permalink: /serien/:name/

defaults:
  - scope: { path: "", type: serien }
    values: { layout: serie }
  - scope: { path: "", type: posts }
    values: { layout: beitrag, permalink: "/journal/:title/" }

# ------------------------------------------------------------
# Technik
# ------------------------------------------------------------
timezone: Europe/Berlin
markdown: kramdown
kramdown:
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]   # deutsche Anführungszeichen

exclude:
  - README.md
  - tools
  - _eingang
  - Gemfile
  - Gemfile.lock
  - vendor
