# ------------------------------------------------------------
# Grundeinstellungen der Seite
# ------------------------------------------------------------
title: Christopher Schmidtke
description: >-
  Schwarzweißfotografie auf Film von Christopher Schmidtke, im Mittelformat und auf Kleinbild.
  Serien aus Japan, Skandinavien, den USA, Madeira und in Infrarot.

# Überschrift und Text oben auf der Startseite
ueberschrift: Analoge Fotografie
einleitung: >-
  Seit 2010 fotografiere ich auf Film, fast immer in Schwarzweiß. Am liebsten mit meiner
  Rolleiflex 2.8C aus den 1950er-Jahren: Ich schaue von oben durch den Lichtschacht, drehe für
  jedes Bild die Kurbel und habe zwölf Versuche pro Film. Hier zeige ich, was von Reisen,
  Roadtrips und Nebeltagen übrig bleibt, wenn der Film entwickelt ist. Eine irrationale Leidenschaft.
lang: de
locale: de_DE

# Die Adresse der Seite (url, baseurl) setzt GitHub Pages automatisch,
# passend zum Repository-Namen und später zur eigenen Domain. Nicht eintragen.

author:
  name: Christopher Schmidtke
  email: ""          # erst eintragen, wenn das Postfach funktioniert, z. B. kontakt@christopherschmidtke.de
                     # erscheint dann automatisch in Impressum und Datenschutzerklärung
  instagram: ""      # nur der Name, ohne @

# Anschrift für Impressum und Datenschutzerklärung
anschrift:
  strasse: Elsavastraße 36
  ort: 63863 Eschau

# Suchmaschinen: false = alle Seiten tragen "noindex" (Testphase).
# Auf true stellen, sobald Bilder, Texte und Domain stehen.
indexierung: false

# Impressum und Datenschutz im Footer verlinken
rechtliches: true

# Desktop-Hängung der Serien: reihen | raster | einzeln
# Auf dem Handy gibt es immer eine Spalte.
haengung: reihen

# Lange Kante der Bilder in Pixel. tools/bilder.py liest diesen Wert.
# Nach einer Änderung die Bilder mit tools/bilder.py neu erzeugen.
bildgroesse: 1600

# Vorschaubild für Link-Vorschauen auf Seiten ohne eigenes Bild
og_bild: /assets/images/infrarot/infrarot-schiefer-baum.jpg

# ------------------------------------------------------------
# Inhalte
# ------------------------------------------------------------
collections:
  serien:
    output: true
    permalink: /serien/:name/

defaults:
  - scope: { path: "", type: serien }
    values: { layout: serie }
  - scope: { path: "", type: posts }
    values: { layout: beitrag, permalink: "/journal/:title/" }

# ------------------------------------------------------------
# Technik
# ------------------------------------------------------------
timezone: Europe/Berlin
markdown: kramdown
kramdown:
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]   # deutsche Anführungszeichen

exclude:
  - README.md
  - tools
  - _eingang
  - Gemfile
  - Gemfile.lock
  - vendor
