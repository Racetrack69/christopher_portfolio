# Veröffentlichungen in Magazinen und online.
#
# Felder:
#   magazin   Pflicht. Name des Magazins bzw. der Website.
#   online    true für Beiträge auf Websites. Sie stehen im eigenen Abschnitt „Online“.
#   jahr      Jahr der Ausgabe, ohne Anführungszeichen (jahr: 2020).
#   ausgabe   z. B. "Ausgabe IV/2020" oder "Ausgabe 7, Sommer 2020", online das Datum.
#   titel     Titel des Beitrags. Steht groß in der Liste. Ohne Titel steht dort der Magazinname.
#   sprache   en, wenn der Titel englisch ist (für Silbentrennung und Screenreader).
#   inhalt    kurze Ergänzung, z. B. "Serie Japan, 8 Bilder".
#   serie     Ordnername einer Serie (z. B. island). Darunter erscheint „Zur Serie …“.
#   link      Adresse des Beitrags oder der Heftseite beim Verlag. Der Titel wird zum Link,
#             darunter steht „Online lesen ↗“ (online: true) bzw. „Zum Heft ↗“ (Magazine).
#   cover     Foto der Titelseite: Dateiname ohne Endung, die Datei liegt in
#             assets/images/veroeffentlichungen/ (z. B. cover: photoklassik-2020-4).
#             Hochformat, etwa 600 px breit, sRGB. Sobald ein Eintrag ein Cover hat, bekommt die
#             Liste eine schmale Spalte dafür. Einträge ohne Cover lassen sie frei.
# Alle Felder außer magazin sind optional. Fehlt eine Angabe, die Zeile weglassen.
#
# Sortierung: nach Jahr, neueste oben. Das Jahr steht nur beim ersten Eintrag eines Jahres.
# Innerhalb eines Jahres gilt die Reihenfolge dieser Datei, also das neueste Heft zuerst.
# Einträge ohne Jahr stehen am Ende.

